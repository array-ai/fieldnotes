name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  policy:
    name: Policy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The prohibitions that make Fieldnote what it is: no App Intents, no semantic
      # indexing, no networking, no unpinned model session. Pure grep, so they gate
      # every push without a toolchain.
      - name: Run policy checks
        run: ./Scripts/policy-check.sh

  core:
    name: Core build and test (Linux)
    runs-on: ubuntu-latest
    # The cross-platform half of the codebase: alignment, chunking, grounding, dates,
    # export formats. No Apple SDK, no device, no Xcode — so the parts where a bug is
    # silent are actually compiled and tested on every push.
    container: swift:6.1
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build --package-path Core
      - name: Test
        run: swift test --package-path Core

  app:
    name: App build (xtool)
    # Needs the Darwin Swift SDK, which xtool generates from an Xcode xip that cannot
    # be redistributed — so this job only runs on a self-hosted runner that already
    # has `swift sdk list` showing `darwin`. Set ENABLE_XTOOL_CI to "true" there.
    if: ${{ vars.ENABLE_XTOOL_CI == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v5
      - name: Build app bundle
        run: xtool dev build
