name: Release to TestFlight

# Manual only: uploading a build to TestFlight is not something a push should
# trigger by accident. Needs the same xcode-27 preview image as app.yml, because
# it's building the same iOS 27 SDK-only target -- see app.yml for why.
on:
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Validate with App Store Connect but don't publish (first run should be true)"
        type: boolean
        default: true

jobs:
  release:
    name: Build, sign, and upload
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: spm-xcode27-${{ hashFiles('Package.swift', 'Core/Package.swift', 'Package.resolved') }}
          restore-keys: spm-xcode27-

      # TestFlight rejects a re-upload with a build number it has already seen, so
      # the run number (unique and monotonic per workflow) goes in before packing.
      - name: Bump CFBundleVersion
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Config/Fieldnote-Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Config/FieldnoteWidgets-Info.plist
          # Shown in the app's Activity log, so a shared log says exactly what ran.
          /usr/libexec/PlistBuddy -c "Set :FieldnoteGitCommit ${GITHUB_SHA::7}" Config/Fieldnote-Info.plist

      # Without this, DiarizationModelProvider.bundledModels() throws at runtime --
      # see app.yml for the full explanation. Every build shipped before this step
      # existed was missing these models.
      - name: Cache diarization models
        id: diarization-cache
        uses: actions/cache@v4
        with:
          path: Resources/DiarizationModels
          key: diarization-models-${{ hashFiles('Scripts/fetch-diarization-models.sh') }}

      - name: Vendor diarization models
        if: steps.diarization-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          ./Scripts/fetch-diarization-models.sh "$TMP"
          ./Scripts/vendor-diarization-models.sh "$TMP"

      # Built with Xcode, not xtool's packer: Xcode handles SwiftPM resource bundles
      # itself, while xtool's packer kept failing on dependencies' bundles (swift-crypto,
      # via Apple's coreai-models). xtool still generates the Xcode project from
      # Package.swift and xtool.yml, so there is one source of truth for targets,
      # Info.plists, entitlements, resources and the widget extension.
      #
      # Release configuration on purpose: a debug build once shipped to TestFlight and
      # crashed on record (debug-only actor-isolation assertions).
      - name: Build the .app with Xcode
        run: |
          set -euo pipefail
          brew install xtool-org/tap/xtool
          ./Scripts/generate-xcode-project.sh
          xcodebuild build \
            -workspace xtool/Fieldnote.xcworkspace \
            -scheme Fieldnote \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            > /tmp/xcodebuild.log 2>&1 || { grep -E "error:" /tmp/xcodebuild.log | head -40; tail -40 /tmp/xcodebuild.log; exit 1; }
          tail -3 /tmp/xcodebuild.log

          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] || { echo "Xcode produced no .app"; exit 1; }
          echo "--- built $APP"
          ls "$APP"
          [ -d "$APP/PlugIns" ] || { echo "no PlugIns: the widget extension was not built into the app"; exit 1; }
          [ -d "$APP/DiarizationModels/Nemotron3/Nemotron3Diarizer_c128_split_w8a8.mlmodelc" ] \
            && [ -f "$APP/DiarizationModels/Nemotron3/learnable_sil_emb.bin" ] \
            && [ -f "$APP/DiarizationModels/Nemotron3/pre_encode_proj_t.bin" ] \
            && [ -f "$APP/Places/places.deflate" ] \
            || { echo "bundled models or place table missing from the app"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :FieldnoteGitCommit" "$APP/Info.plist"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      # Keep dSYMs as an artifact so crash reports can be symbolicated with atos
      # (macOS-only, hence doing it in CI rather than after download).
      - name: Generate dSYMs
        run: |
          set -euo pipefail
          dsymutil "$APP_PATH/Fieldnote" -o Fieldnote.dSYM
          WIDGET=$(find "$APP_PATH/PlugIns" -maxdepth 1 -name "*.appex" | head -1)
          dsymutil "$WIDGET/FieldnoteWidgets" -o FieldnoteWidgets.dSYM

          echo "--- symbolicating the record-crash addresses from builds 7 and 8 ---"
          echo "(identical offsets in both crash reports -- same call site, unaffected by the @Sendable change)"
          xcrun atos -o Fieldnote.dSYM/Contents/Resources/DWARF/Fieldnote -l 0x1042e0000 \
            0x00000001043eec5c 0x00000001043eee50

      - uses: actions/upload-artifact@v4
        with:
          name: dSYMs-${{ github.run_number }}
          path: |
            Fieldnote.dSYM
            FieldnoteWidgets.dSYM

      - name: Sign and upload to TestFlight
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          PROVISION_APP_BASE64: ${{ secrets.PROVISION_APP_BASE64 }}
          PROVISION_WIDGET_BASE64: ${{ secrets.PROVISION_WIDGET_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [ "${{ inputs.validate_only }}" = "true" ]; then
            ./Scripts/sign-and-upload.sh "$APP_PATH" --validate-only
          else
            ./Scripts/sign-and-upload.sh "$APP_PATH"
          fi
