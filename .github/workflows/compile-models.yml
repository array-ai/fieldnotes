name: Compile summary models ahead of time

# Manual only. Compiles the portable Core AI summary models (.aimodel) into
# chip-specific .aimodelc files on a Mac, so a phone downloads a ready model
# instead of compiling it itself (Qwen3 1.7B, offered before, ran out of memory
# doing that on an iPhone 16, build 37).
#
# Every run lists what it produced, with sizes and SHA-256s. With `upload` set,
# the output goes to the Hugging Face repo with `hf upload` (Xet storage is
# handled by hf_xet), using the HF_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the compiled models to Hugging Face"
        type: boolean
        default: false
      hf_repo:
        description: "Hugging Face model repo to upload to"
        type: string
        default: publicarray/fieldnote-models
      model:
        description: "Which model to compile"
        type: choice
        options: [minicpm5-1b, minicpm5-2b, lfm2.5-1.2b, qwen3.5-2b]
        default: minicpm5-1b
      preferred_compute:
        description: "Compute unit to compile for: none (Core AI decides, Neural Engine where it can) or neural-engine"
        type: choice
        options: [none, neural-engine]
        default: none
      architectures:
        description: "Chip families to compile for, space separated (the app's debug log names its own). 'h17*' style patterns pick from the valid names. Empty: all, which is very slow"
        type: string
        default: "h17g h17p h18p"

env:
  # Pinned sources, the same revisions the app's catalogue pins.
  # Pinned sources. The 1B's bundles sit at the repo root (the app pins them
  # there); every other model's go in a folder named after it.
  SRC_REPO: ${{ inputs.model == 'qwen3.5-2b' && 'mlboydaisuke/qwen3.5-2B-CoreAI' || inputs.model == 'lfm2.5-1.2b' && 'mlboydaisuke/LFM2.5-1.2B-CoreAI' || inputs.model == 'minicpm5-2b' && 'mlboydaisuke/MiniCPM5-2B-CoreAI' || 'mlboydaisuke/MiniCPM5-1B-CoreAI' }}
  SRC_REV: ${{ inputs.model == 'qwen3.5-2b' && '14e77014db5ae2f3de94825165f5ae58bededd7d' || inputs.model == 'lfm2.5-1.2b' && '3e3241cbcf368a663768dcc4e5785c4f0a02bae4' || inputs.model == 'minicpm5-2b' && '39db5ff9480e5d80e423889e3bacb7f9e9b9e40f' || 'f38d143ec50cb2e54d8388479b919e3b9283943b' }}
  # The portable iOS model's folder in the source repo.
  SRC_PATH: ${{ inputs.model == 'qwen3.5-2b' && 'gpu-pipelined-b2/qwen3_5_2b_decode_int8hu_block32_sym' || inputs.model == 'lfm2.5-1.2b' && 'gpu-pipelined-b2/lfm2_5_1_2b_instruct_decode_int8hu_block32_sym' || 'ios-static' }}
  UPLOAD_PATH: ${{ inputs.model == 'qwen3.5-2b' && 'qwen3.5-2b' || inputs.model == 'lfm2.5-1.2b' && 'lfm2.5-1.2b' || inputs.model == 'minicpm5-2b' && 'minicpm5-2b' || '.' }}
  PREFERRED_COMPUTE: ${{ inputs.preferred_compute }}

jobs:
  compile:
    name: Compile
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install the Hugging Face CLI
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install --quiet -U "huggingface_hub[hf_xet]"
          echo "$RUNNER_TEMP/hf/bin" >> "$GITHUB_PATH"

      # coreai-build ships with the Metal Toolchain, an optional Xcode component.
      - name: Install the Metal Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find coreai-build
          xcrun coreai-build compile --help

      - name: Download the portable models
        run: |
          set -euo pipefail
          hf download "$SRC_REPO" --revision "$SRC_REV" --include "$SRC_PATH/*" --local-dir src/model
          find src -name "*.aimodel" -maxdepth 5

      # As documented: one .aimodelc per device architecture, named
      # <model>.<arch>.aimodelc, where <arch> is AIModel.deviceArchitectureName.
      # All architectures in one process ran the runner out of memory (Qwen,
      # killed after 6 min), so: one architecture per process, smallest model
      # first, and a model that fails doesn't stop the others.
      # coreai-build doesn't list its architectures, and an unknown one fails at
      # once. So: try likely names, each stopped after a few seconds (a valid one
      # starts compiling), keep the valid ones, then pick the requested ones.
      - name: List architectures
        env:
          ARCHS: ${{ inputs.architectures }}
        run: |
          set -uo pipefail
          model=$(find src -name "*.aimodel" -maxdepth 5 | head -1)
          : > valid.txt
          for gen in 13 14 15 16 17 18 19 20; do
            for suffix in "" p g s m c d x a b e; do
              arch="h$gen$suffix"
              out=$(perl -e 'alarm shift; exec @ARGV' 6 xcrun coreai-build compile "$model" --platform iOS \
                --architecture "$arch" --output "$RUNNER_TEMP/probe-$arch" 2>&1 || true)
              if ! grep -q "Unknown architecture" <<< "$out"; then echo "$arch" >> valid.txt; fi
            done
          done
          rm -rf "$RUNNER_TEMP"/probe-*
          echo "valid architectures: $(tr '\n' ' ' < valid.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          : > archs.txt
          set -f  # patterns like h17* are matched below, not against file names
          for want in $ARCHS; do
            for arch in $(cat valid.txt); do
              case "$arch" in $want) echo "$arch" >> archs.txt ;; esac
            done
          done
          sort -u -o archs.txt archs.txt
          echo "compiling for: $(tr '\n' ' ' < archs.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$ARCHS" ] && [ ! -s archs.txt ] && { echo "none of '$ARCHS' is a valid architecture"; exit 1; }
          exit 0

      - name: Compile
        run: |
          set -uo pipefail
          mkdir -p out
          failed=0
          for model in $(find src -name "*.aimodel" -maxdepth 5 -exec du -sk {} + | sort -n | cut -f2); do
            name=$(basename "$model" .aimodel)
            mkdir -p "out/$name"
            if [ -s archs.txt ]; then
              for arch in $(cat archs.txt); do
                echo "=== $name for $arch"
                xcrun coreai-build compile "$model" --platform iOS --min-deployment-version 27.0 \
                  --preferred-compute "$PREFERRED_COMPUTE" \
                  --architecture "$arch" --output "out/$name" || { echo "failed: $name $arch"; failed=1; }
              done
            else
              echo "=== $name, all architectures (none listed)"
              xcrun coreai-build compile "$model" --platform iOS --min-deployment-version 27.0 \
                --preferred-compute "$PREFERRED_COMPUTE" \
                --output "out/$name" || { echo "failed: $name"; failed=1; }
            fi
          done
          vm_stat | head -5
          exit 0

      # One ready-to-load bundle per architecture, laid out like the portable one:
      # ios-<arch>/metadata.json (pointing at the compiled model), tokenizer/, and
      # <model>.<arch>.aimodelc. The app downloads only its own architecture's.
      - name: Bundle
        run: |
          set -euo pipefail
          mkdir -p bundles
          static=$(dirname "$(find src -name "*.aimodel" -maxdepth 5 | head -1)")
          for compiled in $(find out -name "*.aimodelc" -maxdepth 2); do
            file=$(basename "$compiled")
            arch=$(echo "$file" | sed -E 's/.*\.([^.]+)\.aimodelc$/\1/')
            dest="bundles/ios-$arch"
            mkdir -p "$dest"
            cp -R "$static/tokenizer" "$dest/"
            mv "$compiled" "$dest/"
            python3 - "$static/metadata.json" "$dest/metadata.json" "$file" "$arch" <<'PY'
          import json, os, sys
          src, dst, main, arch = sys.argv[1:]
          meta = json.load(open(src))
          meta["assets"]["main"] = main
          meta.setdefault("compilation", {})["targets"] = [f"{arch} (coreai-build compile --platform iOS --min-deployment-version 27.0 --preferred-compute {os.environ['PREFERRED_COMPUTE']})"]
          json.dump(meta, open(dst, "w"), indent=2)
          PY
          done

      - name: Report
        run: |
          echo "## Compiled bundles" >> "$GITHUB_STEP_SUMMARY"
          for dir in bundles/*; do
            echo "- \`$dir\`: $(du -sh "$dir" | cut -f1), $(find "$dir" -type f | wc -l | tr -d ' ') files" | tee -a "$GITHUB_STEP_SUMMARY"
          done

      # The repo's README is edited on Hugging Face and left alone here.
      - name: Upload to Hugging Face
        if: inputs.upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo }}
        run: |
          set -euo pipefail
          # Only output that worked: nothing goes up after a failed compile.
          if ! find bundles -name "*.aimodelc" -maxdepth 2 | grep -q .; then
            echo "nothing compiled; not uploading"
            exit 1
          fi
          # The model's licence goes up with it.
          if [ "$SRC_REPO" = "mlboydaisuke/qwen3.5-2B-CoreAI" ]; then
            # No licence file in the export: Qwen's own, from the base model.
            hf download Qwen/Qwen3.5-2B LICENSE --revision 15852e8c16360a2fea060d615a32b45270f8a8fc --local-dir licence
          else
            hf download "$SRC_REPO" LICENSE --revision "$SRC_REV" --local-dir licence
          fi
          cp licence/LICENSE bundles/LICENSE
          # Replaces the earlier loose compiled folders with the bundles.
          if [ "$UPLOAD_PATH" = "." ]; then
            # Replaces the earlier loose compiled folders with the bundles.
            hf upload "$HF_REPO" bundles . --delete "minicpm5_1b_*/**" --commit-message "Ahead-of-time compiled summary models (run $GITHUB_RUN_NUMBER)"
          else
            hf upload "$HF_REPO" bundles "$UPLOAD_PATH" --commit-message "Ahead-of-time compiled $UPLOAD_PATH (run $GITHUB_RUN_NUMBER)"
          fi
