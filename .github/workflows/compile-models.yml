name: Compile summary models ahead of time

# Manual only. Compiles the portable Core AI summary models (.aimodel) into
# chip-specific .aimodelc files on a Mac, so a phone downloads a ready model
# instead of compiling it itself (Qwen3 1.7B, offered before, ran out of memory
# doing that on an iPhone 16, build 37).
#
# Every run lists what it produced, with sizes and SHA-256s. With `upload` set,
# the output goes to the Hugging Face repo with `hf upload` (Xet storage is
# handled by hf_xet), using the HF_TOKEN secret.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the compiled models to Hugging Face"
        type: boolean
        default: false
      hf_repo:
        description: "Hugging Face model repo to upload to"
        type: string
        default: publicarray/fieldnote-models
      architectures:
        description: "Chip families to compile for, space separated (the app's debug log names its own). 'h17*' style patterns pick from the valid names. Empty: all, which is very slow"
        type: string
        default: "h17*"

env:
  # Pinned sources, the same revisions the app's catalogue pins.
  MINICPM_REPO: mlboydaisuke/MiniCPM5-1B-CoreAI
  MINICPM_REV: f38d143ec50cb2e54d8388479b919e3b9283943b

jobs:
  compile:
    name: Compile
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Install the Hugging Face CLI
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/hf"
          "$RUNNER_TEMP/hf/bin/pip" install --quiet -U "huggingface_hub[hf_xet]"
          echo "$RUNNER_TEMP/hf/bin" >> "$GITHUB_PATH"

      # coreai-build ships with the Metal Toolchain, an optional Xcode component.
      - name: Install the Metal Toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find coreai-build
          xcrun coreai-build compile --help

      - name: Download the portable models
        run: |
          set -euo pipefail
          hf download "$MINICPM_REPO" --revision "$MINICPM_REV" --include "ios-static/*" --local-dir src/minicpm5
          find src -name "*.aimodel" -maxdepth 3

      # As documented: one .aimodelc per device architecture, named
      # <model>.<arch>.aimodelc, where <arch> is AIModel.deviceArchitectureName.
      # All architectures in one process ran the runner out of memory (Qwen,
      # killed after 6 min), so: one architecture per process, smallest model
      # first, and a model that fails doesn't stop the others.
      # coreai-build doesn't list its architectures, and an unknown one fails at
      # once. So: try likely names, each stopped after a few seconds (a valid one
      # starts compiling), keep the valid ones, then pick the requested ones.
      - name: List architectures
        env:
          ARCHS: ${{ inputs.architectures }}
        run: |
          set -uo pipefail
          model=$(find src -name "*.aimodel" -maxdepth 3 | head -1)
          : > valid.txt
          for gen in 13 14 15 16 17 18 19 20; do
            for suffix in "" p g s m c d x a b e; do
              arch="h$gen$suffix"
              out=$(perl -e 'alarm shift; exec @ARGV' 6 xcrun coreai-build compile "$model" --platform iOS \
                --architecture "$arch" --output "$RUNNER_TEMP/probe-$arch" 2>&1)
              if ! grep -q "Unknown architecture" <<< "$out"; then echo "$arch" >> valid.txt; fi
            done
          done
          rm -rf "$RUNNER_TEMP"/probe-*
          echo "valid architectures: $(tr '\n' ' ' < valid.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          : > archs.txt
          set -f  # patterns like h17* are matched below, not against file names
          for want in $ARCHS; do
            for arch in $(cat valid.txt); do
              case "$arch" in $want) echo "$arch" >> archs.txt ;; esac
            done
          done
          sort -u -o archs.txt archs.txt
          echo "compiling for: $(tr '\n' ' ' < archs.txt)" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$ARCHS" ] && [ ! -s archs.txt ] && { echo "none of '$ARCHS' is a valid architecture"; exit 1; }
          exit 0

      - name: Compile
        run: |
          set -uo pipefail
          mkdir -p out
          failed=0
          for model in $(find src -name "*.aimodel" -maxdepth 3 -exec du -sk {} + | sort -n | cut -f2); do
            name=$(basename "$model" .aimodel)
            mkdir -p "out/$name"
            if [ -s archs.txt ]; then
              for arch in $(cat archs.txt); do
                echo "=== $name for $arch"
                xcrun coreai-build compile "$model" --platform iOS --min-deployment-version 27.0 \
                  --architecture "$arch" --output "out/$name" || { echo "failed: $name $arch"; failed=1; }
              done
            else
              echo "=== $name, all architectures (none listed)"
              xcrun coreai-build compile "$model" --platform iOS --min-deployment-version 27.0 \
                --output "out/$name" || { echo "failed: $name"; failed=1; }
            fi
          done
          vm_stat | head -5
          exit 0

      - name: Report
        run: |
          echo "## Compiled models" >> "$GITHUB_STEP_SUMMARY"
          find out -name "*.aimodelc" -maxdepth 3 | while read -r dir; do
            size=$(du -sh "$dir" | cut -f1)
            echo "- \`$dir\`: $size" | tee -a "$GITHUB_STEP_SUMMARY"
            find "$dir" -type f | sort | while read -r file; do
              echo "    $(shasum -a 256 "$file" | cut -d' ' -f1)  $(stat -f%z "$file")  ${file#out/}"
            done
          done

      - name: Upload to Hugging Face
        if: inputs.upload
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_REPO: ${{ inputs.hf_repo }}
        run: |
          set -euo pipefail
          # Only output that worked: nothing goes up after a failed compile.
          if ! find out -name "*.aimodelc" -maxdepth 3 | grep -q .; then
            echo "nothing compiled; not uploading"
            exit 1
          fi
          hf upload "$HF_REPO" out . --commit-message "Ahead-of-time compiled summary models (run $GITHUB_RUN_NUMBER)"
