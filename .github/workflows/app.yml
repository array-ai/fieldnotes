name: App build (iOS)

# Manual only. macOS runners bill at 10x the Linux rate, and release.yml already
# builds, packs and uploads the app, so running this on every push paid for the
# same build twice. ci.yml (policy + Core, on Linux) stays the every-push gate;
# run this by hand to check a build without uploading it to TestFlight.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build for iOS 27
    # `macos-latest` is macOS 26 with Xcode 26.6 — an iOS 26 SDK, which cannot build
    # a target deploying to iOS 27. The `xcode-27` image (public preview, arm64) is
    # the only GitHub-hosted runner carrying Xcode 27 and the iOS 27.0 SDK.
    # See https://github.com/actions/runner-images/issues/14404
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # FluidAudio pulls an ~87 MB binary xcframework on every resolve. Caching the
      # SwiftPM download cache (not .build, which goes stale in confusing ways) keeps
      # that out of each run — worth it here because macOS runner time is the scarce
      # kind.
      - name: Cache SwiftPM downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/.swiftpm
          key: spm-xcode27-${{ hashFiles('Package.swift', 'Core/Package.swift', 'Package.resolved') }}
          restore-keys: spm-xcode27-

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version
          xcrun -sdk iphoneos --show-sdk-version

      # SwiftPM's implicit Darwin SDKs (Swift 6.1+) cross-compile to the device
      # triple — no Xcode project, no Apple ID, no signing.
      #
      # The two extra pieces are not optional, and are lifted from xtool's own
      # BuildSettings.swift: `/usr/bin/swift` goes through the xcrun trampoline,
      # which injects SDKROOT=.../MacOSX.sdk and quietly retargets the build at
      # macOS despite --swift-sdk. Invoking the real swift binary with SDKROOT
      # removed is what keeps it building for iOS.
      - name: Build app and widget for device
        run: |
          set +e
          env -u SDKROOT "$(xcrun -f swift)" build --swift-sdk arm64-apple-ios \
            > /tmp/build.log 2>&1
          status=$?
          tail -40 /tmp/build.log
          if [ $status -ne 0 ]; then
            # A failing frontend command echoes its whole (enormous) invocation,
            # which buries the diagnostics. Repeat just the errors at the end.
            echo "================== ERRORS =================="
            grep -E "error: " /tmp/build.log \
              | grep -vE "swift-frontend|Failed frontend|SwiftCompile normal" \
              | head -40
            echo "================== CONTEXT ================="
            grep -A4 -E "error: " /tmp/build.log \
              | grep -vE "swift-frontend|/Applications/Xcode" \
              | head -60
          fi
          exit $status

      # xtool.yml's resources: list copies this directory into the bundle root at
      # pack time. Without it, DiarizationModelProvider.bundledModels() throws at
      # runtime (see Resources/README.md) -- the pack step below succeeds either
      # way, since copying an empty directory isn't an error, so this has to be
      # populated before packing rather than asserted after.
      - name: Cache diarization models
        id: diarization-cache
        uses: actions/cache@v4
        with:
          path: Resources/DiarizationModels
          key: diarization-models-${{ hashFiles('Scripts/fetch-diarization-models.sh') }}

      - name: Vendor diarization models
        if: steps.diarization-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          ./Scripts/fetch-diarization-models.sh "$TMP"
          ./Scripts/vendor-diarization-models.sh "$TMP"

      # The other half of "works with both toolchains": the same package, built the
      # way Xcode builds it. Catches anything that depends on xtool's own build path.
      - name: Build with Xcode
        run: |
          # pipefail: without it the pipe into tail returns tail's status and a failed
          # build reads as a passing step.
          set -euo pipefail
          brew install xtool-org/tap/xtool
          ./Scripts/generate-xcode-project.sh
          xcodebuild build \
            -workspace xtool/Fieldnote.xcworkspace \
            -scheme Fieldnote \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            | tail -5
          APP=$(find build/DerivedData/Build/Products/Debug-iphoneos -maxdepth 1 -name "*.app" | head -1)
          [ -n "$APP" ] && [ -d "$APP/PlugIns" ] && [ -f "$APP/Places/places.deflate" ] \
            && [ -d "$APP/DiarizationModels/Nemotron3" ] \
            || { echo "app, widget, models or place table missing"; exit 1; }
