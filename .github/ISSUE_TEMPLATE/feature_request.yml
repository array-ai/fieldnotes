name: Idea or request
description: Something Fieldnote could do, or do better.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like
      description: The problem you'd like solved, and how you'd use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters to you
      description: How you use Fieldnote today, and where this would fit.
