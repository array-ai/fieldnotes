# xtool project configuration. See https://xtool.sh
#
# Fieldnote builds with xtool rather than Xcode: SwiftPM on Linux, signed and
# installed straight to a device. The app and the Live Activity widget are both
# SwiftPM library products, which is the shape xtool expects.
version: 1
bundleID: com.publicarray.fieldnotes
product: Fieldnote
infoPath: Config/Fieldnote-Info.plist
entitlementsPath: Config/Fieldnote.entitlements

# Copied into the app bundle root. The diarization CoreML models are vendored
# rather than downloaded at runtime: populate them with
# Scripts/fetch-diarization-models.sh + vendor-diarization-models.sh before the
# first build (the directory is gitignored). Places holds the offline place-name
# table, committed and regenerated with Scripts/build-places.py. PrivacyInfo is
# the privacy manifest, which App Store Connect looks for at the bundle root.
resources:
  - Resources/DiarizationModels
  - Resources/Places
  - Resources/PrivacyInfo.xcprivacy

extensions:
  - product: FieldnoteWidgets
    bundleID: com.publicarray.fieldnotes.widgets
    infoPath: Config/FieldnoteWidgets-Info.plist
