    <rect x="40" y="542" width="22" height="36" rx="11"/><rect x="84" y="526" width="22" height="68" rx="11"/><rect x="128" y="500" width="22" height="120" rx="11"/><rect x="172" y="470" width="22" height="180" rx="11"/><rect x="216" y="500" width="22" height="120" rx="11"/><rect x="260" y="526" width="22" height="68" rx="11"/><rect x="304" y="542" width="22" height="36" rx="11"/><rect x="348" y="534" width="22" height="52" rx="11"/><rect x="392" y="512" width="22" height="96" rx="11"/><rect x="436" y="484" width="22" height="152" rx="11"/><rect x="480" y="456" width="22" height="208" rx="11"/><rect x="524" y="484" width="22" height="152" rx="11"/><rect x="568" y="512" width="22" height="96" rx="11"/><rect x="612" y="534" width="22" height="52" rx="11"/><rect x="656" y="542" width="22" height="36" rx="11"/><rect x="700" y="526" width="22" height="68" rx="11"/><rect x="744" y="500" width="22" height="120" rx="11"/><rect x="788" y="470" width="22" height="180" rx="11"/><rect x="832" y="500" width="22" height="120" rx="11"/><rect x="876" y="526" width="22" height="68" rx="11"/><rect x="920" y="542" width="22" height="36" rx="11"/><rect x="964" y="534" width="22" height="52" rx="11"/><rect x="1008" y="512" width="22" height="96" rx="11"/><rect x="1052" y="484" width="22" height="152" rx="11"/><rect x="1096" y="456" width="22" height="208" rx="11"/><rect x="1140" y="484" width="22" height="152" rx="11"/><rect x="1184" y="512" width="22" height="96" rx="11"/><rect x="1228" y="534" width="22" height="52" rx="11"/><rect x="1272" y="542" width="22" height="36" rx="11"/>
  </g>
  <rect x="108" y="148" width="344" height="344" rx="78" fill="none" stroke="#3a4157" stroke-width="3"/>
  <g transform="translate(110 150) scale(0.332)">
    <g clip-path="url(#round)">
  <defs>
    <linearGradient id="ibg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#232838"/>
      <stop offset="1" stop-color="#12141d"/>
    </linearGradient>
    <linearGradient id="iwave" x1="0" y1="0" x2="1024" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb35c"/>
      <stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#ibg)"/>

  <!-- notebook page, folded top-right corner -->
  <path d="M 260 172
           L 692 172
           L 764 244
           L 764 852
           Q 764 876 740 876
           L 284 876
           Q 260 876 260 852
           Z"
        fill="#f6f1e6"/>
  <path d="M 692 172 L 692 220 Q 692 244 716 244 L 764 244 Z" fill="#ddd4bf"/>

  <!-- note lines -->
  <rect x="332" y="336" width="264" height="26" rx="13" fill="#c7bda3"/>
  <rect x="332" y="392" width="200" height="26" rx="13" fill="#c7bda3"/>

  <!-- waveform -->
  <g fill="url(#iwave)">
    <rect x="352" y="588" width="30" height="72"  rx="15"/>
    <rect x="398" y="548" width="30" height="152" rx="15"/>
    <rect x="444" y="500" width="30" height="248" rx="15"/>
    <rect x="490" y="466" width="30" height="316" rx="15"/>
    <rect x="536" y="500" width="30" height="248" rx="15"/>
    <rect x="582" y="548" width="30" height="152" rx="15"/>
    <rect x="628" y="588" width="30" height="72"  rx="15"/>
  </g>
</g>
  </g>
  <g font-family="'Source Sans 3', sans-serif">
    <text x="530" y="250" font-size="104" font-weight="700" fill="#f6f1e6" letter-spacing="-2">Fieldnote</text>
    <text x="532" y="320" font-size="40" font-weight="500" fill="#f6f1e6">Meeting notes that never leave</text>
    <text x="532" y="370" font-size="40" font-weight="500" fill="#f6f1e6">your iPhone.</text>
    <text x="532" y="440" font-size="27" font-weight="400" fill="#a3a7b5">Transcripts, speakers and notes, all on the device.</text>
    <text x="532" y="478" font-size="27" font-weight="400" fill="#a3a7b5">No account, no server, no cloud model. Open source.</text>
  </g>
</svg>